<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tasks</title>
    <meta name="description" content="A minimalistic task management app inspired by Google Tasks">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="src/workspace.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script src="supabase.min.js"></script>
    <script src="sortable.min.js"></script>
</head>

<body>
    <div class="sync-indicator" title="Sync Status (Click to Refresh)" aria-label="Sync Status (Click to Refresh)"></div>
    <div id="authOverlay" class="auth-overlay hidden">
        <div class="auth-card">
            <header class="auth-header">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" />
                    <path d="M8 12.5l2.5 2.5 5.5-5.5" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <h1>Tasks</h1>
            </header>
            <p class="auth-subtitle">Sign in to your private dashboard</p>
            <form id="authForm" class="auth-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div id="authError" class="auth-error hidden"></div>
                <button type="submit" id="authSubmit" class="auth-btn">Sign In</button>
            </form>
            <div class="auth-footer">
                <p class="auth-footer-text">Protected with Supabase RLS</p>
            </div>
        </div>
    </div>

    <div class="app hidden" id="app">
        <!-- Top Bar (visible when sidebar closed) -->
        <header class="topbar" id="topbar">
            <button class="topbar-hamburger" id="topbarHamburger" aria-label="Open menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <div class="topbar-title">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.5" />
                    <path d="M8 12.5l2.5 2.5 5.5-5.5" stroke="white" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>Tasks</span>
            </div>
        </header>

        <!-- Mobile Tabs Navigation -->
        <nav class="mobile-tabs" id="mobileTabs"></nav>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Close menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <div class="app-title">
                    <svg class="app-icon" width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.5" />
                        <path d="M8 12.5l2.5 2.5 5.5-5.5" stroke="white" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span>Tasks</span>
                </div>
            </div>

            <button class="create-btn" id="createBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Create New List
            </button>

            <div class="sidebar-search" id="sidebarSearch">
                <div class="search-input-wrap">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="16.5" y1="16.5" x2="21" y2="21" />
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search tasks"
                        autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search tasks">
                    <button class="search-clear hidden" id="searchClear" type="button" aria-label="Clear search">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="6" y1="6" x2="18" y2="18" />
                            <line x1="18" y1="6" x2="6" y2="18" />
                        </svg>
                    </button>
                </div>
                <div class="search-results hidden" id="searchResults"></div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="all" id="navAll">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 12.5l2.5 2.5 5.5-5.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>All tasks</span>
                </button>
            </nav>

            <div class="sidebar-lists">
                <div class="lists-header">
                    <span>Lists</span>
                    <button class="lists-toggle" id="listsToggle" aria-label="Toggle lists">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </button>
                </div>
                <div class="lists-container" id="listsContainer"></div>
            </div>

            <div class="routine-heatmap hidden" id="routineHeatmap">
                <div class="heatmap-header" id="heatmapHeader">
                    <span>Routine</span>
                    <span class="heatmap-header-right">
                        <span class="heatmap-sub" id="heatmapSub"></span>
                        <button class="lists-toggle heatmap-toggle" id="heatmapToggle" aria-label="Toggle heatmap">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="6 9 12 15 18 9" />
                            </svg>
                        </button>
                    </span>
                </div>
                <div class="heatmap-grid" id="heatmapGrid"></div>
            </div>

            <button class="nav-item" id="signOutBtn" style="margin-top: auto; margin-bottom: 16px; color: var(--danger);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Sign Out</span>
            </button>
            <div class="app-version" id="appVersion"></div>
        </aside>

        <!-- Main Content -->
        <main class="main" id="main">
            <div class="board" id="board"></div>
        </main>

        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <!-- List Context Menu -->
    <div class="context-menu" id="contextMenu">
        <button class="context-menu-item" id="ctxRename">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" />
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
            Rename list
        </button>
        <button class="context-menu-item danger" id="ctxDelete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6.5h16" />
                <path d="M9 6.5V5.25A1.75 1.75 0 0 1 10.75 3.5h2.5A1.75 1.75 0 0 1 15 5.25V6.5" />
                <path d="M6.2 6.5l.7 12.2a2 2 0 0 0 2 1.9h6.2a2 2 0 0 0 2-1.9l.7-12.2" />
                <path d="M10 10.5v6.5M14 10.5v6.5" />
            </svg>
            Delete list
        </button>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <h3 class="modal-title" id="modalTitle">New List</h3>
            <input type="text" class="modal-input" id="modalInput" placeholder="Enter list name" maxlength="50"
                autocomplete="off">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn confirm" id="modalConfirm">Create</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal-overlay" id="deleteConfirmOverlay">
        <div class="modal" id="deleteConfirmModal" style="max-width:350px;padding:25px;">
            <h3 class="modal-title" id="deleteConfirmTitle" style="font-size:20px;margin-bottom:5px;">Delete task?</h3>
            <p id="deleteConfirmMessage" style="color:var(--text3);font-size:15px;margin:0 0 20px;">This can't be undone.</p>
            <div class="modal-actions" style="margin-top:0;gap:10px;justify-content:center;">
                <button class="modal-btn cancel" id="deleteConfirmCancel" style="flex:none;padding:13px 25px;">Cancel</button>
                <button class="modal-btn confirm danger" id="deleteConfirmOk" style="flex:none;padding:13px 25px;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Custom Time Picker Modal -->
    <div class="modal-overlay" id="timeModalOverlay">
        <div class="custom-time-modal" id="customTimeModal">
            <div class="time-modal-task" id="timeModalTask"></div>
            <div class="time-display">
                <button class="time-seg active" id="timeSegHour">--</button>
                <span class="time-colon">:</span>
                <button class="time-seg" id="timeSegMinute">--</button>
            </div>
            <div class="clock-face" id="clockFace">
                <div class="clock-hand hidden" id="clockHand"></div>
                <div class="clock-center"></div>
                <!-- Numbers injected via JS -->
            </div>
            <div class="modal-actions" style="margin-top: 16px;">
                <button class="modal-btn cancel" id="timeClearBtn">Clear time</button>
                <button class="modal-btn confirm" id="timeSetBtn">Set</button>
            </div>
        </div>
    </div>

    <!-- Custom Date Picker Modal -->
    <div class="modal-overlay" id="customDateModalOverlay">
        <div class="custom-calendar-modal" id="customCalendarModal">
            <div class="calendar-header">
                <button class="calendar-nav-btn" id="calPrevBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <div class="calendar-title" id="calTitle">September 2024</div>
                <button class="calendar-nav-btn" id="calNextBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
            <div class="calendar-days-header">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="calendar-grid" id="calGrid">
                <!-- Days injected via JS -->
            </div>
            <div class="modal-actions" style="margin-top: 16px;">
                <button class="modal-btn cancel" id="calClearBtn">Clear date</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.mjs"></script>
</body>

</html>
